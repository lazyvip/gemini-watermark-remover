<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水印位置验证 - 更新后</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .success {
            background: #1a4a1a;
            border: 2px solid #4CAF50;
        }
        .image-container {
            position: relative;
            display: inline-block;
            border: 2px solid #333;
            background: #000;
        }
        .image-container img {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .watermark-box {
            position: absolute;
            border: 3px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
            pointer-events: none;
            box-sizing: border-box;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .info-item {
            background: #333;
            padding: 15px;
            border-radius: 6px;
        }
        .info-item h4 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        .info-item p {
            margin: 5px 0;
            font-size: 14px;
        }
        .check-mark {
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✓ 水印位置验证 - 更新后</h1>
        
        <div class="section success">
            <h2>✓ 更新成功</h2>
            <p>水印检测规则已更新，现在应该能够正确检测水印位置。</p>
            <p><strong>更新内容:</strong></p>
            <ul>
                <li>右边距: 32px → 96px</li>
                <li>下边距: 32px → 95px</li>
            </ul>
        </div>

        <div class="section">
            <h2>测试图片验证</h2>
            <div id="imageInfo" class="info-grid"></div>
            
            <div class="image-container" id="imageContainer">
                <img id="testImage" src="" style="display: none;">
                <div class="watermark-box" id="watermarkBox"></div>
            </div>
        </div>

        <div class="section">
            <h2>验证结果</h2>
            <div id="verificationResult"></div>
        </div>
    </div>

    <script>
        // 更新后的水印检测规则
        function detectWatermarkConfig(imageWidth, imageHeight) {
            if (imageWidth > 1024 && imageHeight > 1024) {
                return {
                    logoSize: 96,
                    marginRight: 64,
                    marginBottom: 64
                };
            } else {
                return {
                    logoSize: 48,
                    marginRight: 96,  // Updated
                    marginBottom: 95  // Updated
                };
            }
        }

        function calculateWatermarkPosition(imageWidth, imageHeight, config) {
            const { logoSize, marginRight, marginBottom } = config;
            return {
                x: imageWidth - marginRight - logoSize,
                y: imageHeight - marginBottom - logoSize,
                width: logoSize,
                height: logoSize
            };
        }

        function loadTestImage() {
            const testImagePath = '微信图片_20260608152411_1696_10.png';
            const img = new Image();
            img.onload = function() {
                displayImage(img);
                analyzeImage(img);
            };
            img.onerror = function() {
                document.getElementById('verificationResult').innerHTML = 
                    '<p style="color: #ff6b6b;">无法加载测试图片</p>';
            };
            img.src = testImagePath;
        }

        function displayImage(img) {
            const image = document.getElementById('testImage');
            image.src = img.src;
            image.style.display = 'block';
        }

        function analyzeImage(img) {
            const width = img.width;
            const height = img.height;

            const config = detectWatermarkConfig(width, height);
            const position = calculateWatermarkPosition(width, height, config);

            // 显示图片信息
            document.getElementById('imageInfo').innerHTML = `
                <div class="info-item">
                    <h4>图片信息</h4>
                    <p>尺寸: ${width} × ${height}</p>
                    <p>面积: ${(width * height).toLocaleString()} 像素</p>
                </div>
                <div class="info-item">
                    <h4>更新后的检测规则</h4>
                    <p>水印尺寸: ${config.logoSize} × ${config.logoSize}</p>
                    <p>右边距: ${config.marginRight}px <span class="check-mark">✓</span></p>
                    <p>下边距: ${config.marginBottom}px <span class="check-mark">✓</span></p>
                </div>
                <div class="info-item">
                    <h4>检测到的水印位置</h4>
                    <p>X: ${position.x}</p>
                    <p>Y: ${position.y}</p>
                    <p>相对位置: (${((position.x / width) * 100).toFixed(2)}%, ${((position.y / height) * 100).toFixed(2)}%)</p>
                </div>
            `;

            // 绘制水印框
            drawWatermarkBox(position);

            // 验证结果
            const actualX = 1232;
            const actualY = 625;
            const diffX = position.x - actualX;
            const diffY = position.y - actualY;

            const isCorrect = diffX === 0 && diffY === 0;

            document.getElementById('verificationResult').innerHTML = `
                <div class="info-grid">
                    <div class="info-item">
                        <h4>实际水印位置</h4>
                        <p>X: ${actualX}</p>
                        <p>Y: ${actualY}</p>
                    </div>
                    <div class="info-item">
                        <h4>位置差异</h4>
                        <p>X 差异: ${diffX}px ${diffX === 0 ? '<span class="check-mark">✓ 正确</span>' : '✗ 错误'}</p>
                        <p>Y 差异: ${diffY}px ${diffY === 0 ? '<span class="check-mark">✓ 正确</span>' : '✗ 错误'}</p>
                    </div>
                    <div class="info-item" style="background: ${isCorrect ? '#1a4a1a' : '#4a1a1a'};">
                        <h4>${isCorrect ? '✓✓✓ 验证成功' : '✗✗✗ 验证失败'}</h4>
                        <p>${isCorrect ? '水印位置检测完全正确！' : '水印位置仍有偏差，需要进一步调整。'}</p>
                    </div>
                </div>
            `;
        }

        function drawWatermarkBox(position) {
            const img = document.getElementById('testImage');
            const box = document.getElementById('watermarkBox');

            const displayWidth = img.clientWidth;
            const displayHeight = img.clientHeight;
            const naturalWidth = img.naturalWidth;
            const naturalHeight = img.naturalHeight;

            const scaleX = displayWidth / naturalWidth;
            const scaleY = displayHeight / naturalHeight;

            box.style.left = (position.x * scaleX) + 'px';
            box.style.top = (position.y * scaleY) + 'px';
            box.style.width = (position.width * scaleX) + 'px';
            box.style.height = (position.height * scaleY) + 'px';
        }

        // 页面加载时自动加载测试图片
        window.onload = function() {
            loadTestImage();
        };

        // 窗口大小改变时重新绘制
        window.onresize = function() {
            const img = document.getElementById('testImage');
            if (img.style.display !== 'none') {
                const config = detectWatermarkConfig(img.naturalWidth, img.naturalHeight);
                const position = calculateWatermarkPosition(img.naturalWidth, img.naturalHeight, config);
                drawWatermarkBox(position);
            }
        };
    </script>
</body>
</html>

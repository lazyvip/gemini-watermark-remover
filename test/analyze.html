<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水印位置分析</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .image-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
        .image-container img {
            max-width: 100%;
            border: 2px solid #333;
        }
        .watermark-box {
            position: absolute;
            border: 3px solid red;
            background: rgba(255, 0, 0, 0.2);
            pointer-events: none;
        }
        .info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .controls {
            margin: 20px 0;
        }
        input, button {
            margin: 5px;
            padding: 8px 12px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }
        button {
            cursor: pointer;
            background: #4CAF50;
        }
        button:hover {
            background: #45a049;
        }
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gemini 水印位置分析工具</h1>
        
        <div class="controls">
            <input type="file" id="imageInput" accept="image/*">
            <button onclick="analyzeCurrentRules()">分析当前规则</button>
            <button onclick="toggleGrid()">显示/隐藏网格</button>
        </div>

        <div class="info" id="imageInfo">
            <h3>图片信息</h3>
            <p>请选择一张图片进行分析</p>
        </div>

        <div class="image-container" id="imageContainer" style="display: none;">
            <img id="testImage" src="">
            <div class="watermark-box" id="watermarkBox"></div>
            <canvas class="grid-overlay" id="gridCanvas"></canvas>
        </div>

        <div class="info" id="watermarkInfo">
            <h3>水印信息</h3>
            <div id="watermarkDetails"></div>
        </div>
    </div>

    <script>
        let currentImage = null;
        let showGrid = false;

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                loadImage(file);
            }
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    displayImage(img);
                    analyzeImage(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function displayImage(img) {
            const container = document.getElementById('imageContainer');
            const image = document.getElementById('testImage');
            
            image.src = img.src;
            container.style.display = 'block';
            
            // 设置网格画布大小
            const gridCanvas = document.getElementById('gridCanvas');
            gridCanvas.width = img.width;
            gridCanvas.height = img.height;
        }

        function analyzeImage(img) {
            const width = img.width;
            const height = img.height;

            // 显示图片基本信息
            const imageInfo = document.getElementById('imageInfo');
            imageInfo.innerHTML = `
                <h3>图片信息</h3>
                <p><strong>尺寸:</strong> ${width} × ${height}</p>
                <p><strong>面积:</strong> ${(width * height).toLocaleString()} 像素</p>
                <p><strong>宽高比:</strong> ${(width / height).toFixed(2)}</p>
            `;

            analyzeCurrentRules();
        }

        function analyzeCurrentRules() {
            if (!currentImage) return;

            const width = currentImage.width;
            const height = currentImage.height;

            // 当前规则
            const currentConfig = detectWatermarkConfig(width, height);
            const currentPosition = calculateWatermarkPosition(width, height, currentConfig);

            // 显示水印信息
            const watermarkDetails = document.getElementById('watermarkDetails');
            watermarkDetails.innerHTML = `
                <h4>当前算法检测结果:</h4>
                <p><strong>水印尺寸:</strong> ${currentConfig.logoSize} × ${currentConfig.logoSize}</p>
                <p><strong>右边距:</strong> ${currentConfig.marginRight}px</p>
                <p><strong>下边距:</strong> ${currentConfig.marginBottom}px</p>
                <p><strong>水印位置:</strong> (${currentPosition.x}, ${currentPosition.y})</p>
                <p><strong>水印区域:</strong> ${currentPosition.width} × ${currentPosition.height}</p>
                
                <h4 style="margin-top: 20px;">检测条件:</h4>
                <p>宽 > 1024: ${width > 1024 ? '是' : '否'} (${width})</p>
                <p>高 > 1024: ${height > 1024 ? '是' : '否'} (${height})</p>
                <p>使用 96×96 水印: ${width > 1024 && height > 1024 ? '是' : '否'}</p>
            `;

            // 绘制水印框
            drawWatermarkBox(currentPosition);
        }

        function detectWatermarkConfig(imageWidth, imageHeight) {
            // 当前的水印检测规则
            if (imageWidth > 1024 && imageHeight > 1024) {
                return {
                    logoSize: 96,
                    marginRight: 64,
                    marginBottom: 64
                };
            } else {
                return {
                    logoSize: 48,
                    marginRight: 32,
                    marginBottom: 32
                };
            }
        }

        function calculateWatermarkPosition(imageWidth, imageHeight, config) {
            const { logoSize, marginRight, marginBottom } = config;
            return {
                x: imageWidth - marginRight - logoSize,
                y: imageHeight - marginBottom - logoSize,
                width: logoSize,
                height: logoSize
            };
        }

        function drawWatermarkBox(position) {
            const box = document.getElementById('watermarkBox');
            const img = document.getElementById('testImage');
            
            // 计算缩放比例
            const displayWidth = img.clientWidth;
            const displayHeight = img.clientHeight;
            const naturalWidth = img.naturalWidth;
            const naturalHeight = img.naturalHeight;
            
            const scaleX = displayWidth / naturalWidth;
            const scaleY = displayHeight / naturalHeight;

            box.style.left = (position.x * scaleX) + 'px';
            box.style.top = (position.y * scaleY) + 'px';
            box.style.width = (position.width * scaleX) + 'px';
            box.style.height = (position.height * scaleY) + 'px';
        }

        function toggleGrid() {
            showGrid = !showGrid;
            const gridCanvas = document.getElementById('gridCanvas');
            const ctx = gridCanvas.getContext('2d');
            
            if (showGrid) {
                drawGrid(ctx, gridCanvas.width, gridCanvas.height);
            } else {
                ctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
            }
        }

        function drawGrid(ctx, width, height) {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;

            // 绘制网格
            const gridSize = 32;
            for (let x = 0; x <= width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y <= height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // 标记 1024 边界线
            ctx.strokeStyle = 'rgba(255, 255, 0, 0.5)';
            ctx.lineWidth = 2;
            
            if (width > 1024) {
                ctx.beginPath();
                ctx.moveTo(1024, 0);
                ctx.lineTo(1024, height);
                ctx.stroke();
            }
            
            if (height > 1024) {
                ctx.beginPath();
                ctx.moveTo(0, 1024);
                ctx.lineTo(width, 1024);
                ctx.stroke();
            }
        }

        // 自动加载测试图片
        window.onload = function() {
            // 尝试自动加载 test 目录下的图片
            const testImagePath = 'test/微信图片_20260608152411_1696_10.png';
            const img = new Image();
            img.onload = function() {
                currentImage = img;
                displayImage(img);
                analyzeImage(img);
            };
            img.onerror = function() {
                console.log('未找到测试图片，请手动选择');
            };
            img.src = testImagePath;
        };
    </script>
</body>
</html>
